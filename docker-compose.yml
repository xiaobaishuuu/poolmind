# PoolMind 本地开发数据库
# 只有一个 Postgres 实例，但内部创建两个完全独立的数据库：
#   - poolmind_dev  ：日常开发用，你手动录入的数据都在这里
#   - poolmind_test ：自动化测试用，测试每次会清空重建，永远碰不到 dev 的数据
# 生产库 poolmind_production 是 AWS RDS 上一台独立真机，绝不会在本地跑（见 README「合规须知」）。
services:
  postgres:
    image: postgres:16
    container_name: poolmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: poolmind
      POSTGRES_PASSWORD: poolmind_local_dev
      # 这个是实例启动时默认建的库；另一个 poolmind_test 由 init 脚本补建
      POSTGRES_DB: poolmind_dev
      TZ: Asia/Hong_Kong
      PGTZ: Asia/Hong_Kong
    ports:
      - "5432:5432"
    volumes:
      - poolmind_pgdata:/var/lib/postgresql/data
      # 容器首次初始化时会自动执行这个目录里的 .sql，用来补建 test 库
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poolmind -d poolmind_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  poolmind_pgdata:
